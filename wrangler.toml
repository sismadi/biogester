name = "biogester"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Frontend statis (html/js/css) disajikan Cloudflare langsung dari ./public.
# Hanya /api/* yang menjalankan kode Worker (backend).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Environment (non-rahasia). Boleh diubah di dashboard Cloudflare.
[vars]
ENVIRONMENT = "production"
SESSION_TTL = "604800"   # umur sesi (detik) = 7 hari
MIN_TUKAR = "10000"      # minimal penukaran saldo (Rp)

# Database D1: isi database_id dari `wrangler d1 create biogester`
[[d1_databases]]
binding = "DB"
database_name = "biogester"
database_id = "8b102801-2b36-4918-8c43-a7461320e390"

# RAHASIA (jangan ditulis di sini) -> `wrangler secret put SESSION_SECRET`
#                                      `wrangler secret put CAPTCHA_SECRET`
